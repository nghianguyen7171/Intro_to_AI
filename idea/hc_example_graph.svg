<svg viewBox="0 0 490 545" xmlns="http://www.w3.org/2000/svg"
     font-family="'Inter','Segoe UI',sans-serif">
<defs>
  <marker id="arr" viewBox="0 0 10 7" markerWidth="9" markerHeight="7"
          refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#64748b"/>
  </marker>
  <marker id="arr-hl" viewBox="0 0 10 7" markerWidth="9" markerHeight="7"
          refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#6366f1"/>
  </marker>
</defs>

<!-- ───────────────── REGULAR EDGES ───────────────── -->

<!-- B → D  (cost 2) -->
<line x1="360" y1="106" x2="360" y2="224"
      stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
<rect x="336" y="153" width="26" height="18" rx="9" fill="#475569"/>
<text x="349" y="162" fill="white" font-size="11" font-weight="700"
      text-anchor="middle" dominant-baseline="central">2</text>

<!-- B → T  (cost 9, arc to right) -->
<path d="M 375,96 C 460,160 460,360 375,404"
      stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<rect x="426" y="235" width="26" height="18" rx="9" fill="#475569"/>
<text x="439" y="244" fill="white" font-size="11" font-weight="700"
      text-anchor="middle" dominant-baseline="central">9</text>

<!-- A → D  (cost 4) -->
<line x1="116" y1="250" x2="334" y2="250"
      stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
<rect x="206" y="238" width="26" height="18" rx="9" fill="#475569"/>
<text x="219" y="247" fill="white" font-size="11" font-weight="700"
      text-anchor="middle" dominant-baseline="central">4</text>

<!-- S → B  (cost 5) -->
<line x1="116" y1="80" x2="334" y2="80"
      stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
<rect x="206" y="68" width="26" height="18" rx="9" fill="#475569"/>
<text x="219" y="77" fill="white" font-size="11" font-weight="700"
      text-anchor="middle" dominant-baseline="central">5</text>

<!-- D → T  (cost 6) -->
<line x1="360" y1="276" x2="360" y2="394"
      stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
<rect x="336" y="323" width="26" height="18" rx="9" fill="#475569"/>
<text x="349" y="332" fill="white" font-size="11" font-weight="700"
      text-anchor="middle" dominant-baseline="central">6</text>

<!-- C → D  (cost 3, diagonal) -->
<line x1="112" y1="406" x2="338" y2="264"
      stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
<rect x="195" y="323" width="26" height="18" rx="9" fill="#475569"/>
<text x="208" y="332" fill="white" font-size="11" font-weight="700"
      text-anchor="middle" dominant-baseline="central">3</text>

<!-- ───── HC PATH (highlighted in indigo) ───── -->

<!-- S → A  (HC path, cost 2) -->
<line x1="90" y1="106" x2="90" y2="224"
      stroke="#6366f1" stroke-width="3" marker-end="url(#arr-hl)"/>
<rect x="56" y="153" width="26" height="18" rx="9" fill="#6366f1"/>
<text x="69" y="162" fill="white" font-size="11" font-weight="700"
      text-anchor="middle" dominant-baseline="central">2</text>

<!-- A → C  (HC path, cost 1) -->
<line x1="90" y1="276" x2="90" y2="394"
      stroke="#6366f1" stroke-width="3" marker-end="url(#arr-hl)"/>
<rect x="56" y="323" width="26" height="18" rx="9" fill="#6366f1"/>
<text x="69" y="332" fill="white" font-size="11" font-weight="700"
      text-anchor="middle" dominant-baseline="central">1</text>

<!-- ───────────────── NODES ───────────────── -->

<!-- S — start -->
<circle cx="90" cy="80" r="26" fill="#6366f1" stroke="#4338ca" stroke-width="2.5"/>
<text x="90" y="80" fill="white" font-size="18" font-weight="800"
      text-anchor="middle" dominant-baseline="central">S</text>
<rect x="103" y="54" width="34" height="19" rx="9"
      fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="120" y="64" fill="#78350f" font-size="11" font-weight="700"
      text-anchor="middle" dominant-baseline="central">h=9</text>

<!-- A -->
<circle cx="90" cy="250" r="26" fill="#6366f1" stroke="#4338ca" stroke-width="2.5"/>
<text x="90" y="250" fill="white" font-size="18" font-weight="800"
      text-anchor="middle" dominant-baseline="central">A</text>
<rect x="103" y="224" width="34" height="19" rx="9"
      fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="120" y="234" fill="#78350f" font-size="11" font-weight="700"
      text-anchor="middle" dominant-baseline="central">h=5</text>

<!-- C — LOCAL MINIMUM (red) -->
<circle cx="90" cy="420" r="26" fill="#ef4444" stroke="#b91c1c" stroke-width="2.5"/>
<text x="90" y="420" fill="white" font-size="18" font-weight="800"
      text-anchor="middle" dominant-baseline="central">C</text>
<rect x="103" y="394" width="34" height="19" rx="9"
      fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="120" y="404" fill="#78350f" font-size="11" font-weight="700"
      text-anchor="middle" dominant-baseline="central">h=3</text>
<!-- stuck label -->
<text x="90" y="458" fill="#b91c1c" font-size="11" font-weight="700"
      text-anchor="middle">⚑ cực tiểu cục bộ</text>

<!-- B -->
<circle cx="360" cy="80" r="26" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
<text x="360" y="80" fill="white" font-size="18" font-weight="800"
      text-anchor="middle" dominant-baseline="central">B</text>
<rect x="328" y="54" width="34" height="19" rx="9"
      fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="345" y="64" fill="#78350f" font-size="11" font-weight="700"
      text-anchor="middle" dominant-baseline="central">h=7</text>

<!-- D -->
<circle cx="360" cy="250" r="26" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
<text x="360" y="250" fill="white" font-size="18" font-weight="800"
      text-anchor="middle" dominant-baseline="central">D</text>
<rect x="328" y="224" width="34" height="19" rx="9"
      fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="345" y="234" fill="#78350f" font-size="11" font-weight="700"
      text-anchor="middle" dominant-baseline="central">h=4</text>

<!-- T — goal (green) -->
<circle cx="360" cy="420" r="26" fill="#10b981" stroke="#047857" stroke-width="2.5"/>
<text x="360" y="420" fill="white" font-size="18" font-weight="800"
      text-anchor="middle" dominant-baseline="central">T</text>
<rect x="328" y="394" width="34" height="19" rx="9"
      fill="#d1fae5" stroke="#10b981" stroke-width="1.5"/>
<text x="345" y="404" fill="#065f46" font-size="11" font-weight="700"
      text-anchor="middle" dominant-baseline="central">h=0</text>

<!-- ───────────────── LEGEND ───────────────── -->
<rect x="10" y="490" width="470" height="48" rx="8"
      fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="32" cy="514" r="9" fill="#6366f1"/>
<text x="45" y="518" font-size="11" fill="#475569">Đường HC đi (S→A→C)</text>
<circle cx="178" cy="514" r="9" fill="#ef4444"/>
<text x="191" y="518" font-size="11" fill="#475569">Cực tiểu cục bộ</text>
<circle cx="300" cy="514" r="9" fill="#10b981"/>
<text x="313" y="518" font-size="11" fill="#475569">Đích (T)</text>
<rect x="380" y="507" width="18" height="14" rx="7"
      fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
<text x="402" y="518" font-size="11" fill="#475569">h(n)</text>
</svg>
