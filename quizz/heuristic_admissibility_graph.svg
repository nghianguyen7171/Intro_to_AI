<svg width="640" height="510" viewBox="0 0 640 510" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="640" height="510" fill="#fafafa" rx="8"/>

  <!-- ===== EDGES ===== -->

  <!-- S→A, cost 2 -->
  <line x1="286" y1="83" x2="164" y2="172" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="216" y="119" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c1d1d">2</text>

  <!-- S→B, cost 5 -->
  <line x1="334" y1="83" x2="456" y2="172" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="404" y="119" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c1d1d">5</text>

  <!-- A→C, cost 4 -->
  <line x1="125" y1="216" x2="75" y2="309" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="88" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c1d1d">4</text>

  <!-- A→D, cost 1 -->
  <line x1="163" y1="210" x2="287" y2="316" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="218" y="257" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c1d1d">1</text>

  <!-- B→D, cost 2 -->
  <line x1="457" y1="210" x2="333" y2="316" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="402" y="257" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c1d1d">2</text>

  <!-- B→E, cost 3 -->
  <line x1="493" y1="217" x2="537" y2="308" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="524" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c1d1d">3</text>

  <!-- C→F, cost 3 -->
  <line x1="78" y1="359" x2="137" y2="436" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="97" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c1d1d">3</text>

  <!-- D→F, cost 4 -->
  <line x1="287" y1="354" x2="178" y2="441" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="225" y="397" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c1d1d">4</text>

  <!-- D→E, cost 2 -->
  <line x1="340" y1="335" x2="520" y2="335" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="430" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c1d1d">2</text>

  <!-- E→G, cost 4 -->
  <line x1="533" y1="360" x2="482" y2="435" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="518" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c1d1d">4</text>

  <!-- F→G, cost 2 -->
  <line x1="185" y1="460" x2="435" y2="460" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="310" y="451" text-anchor="middle" font-size="13" font-weight="bold" fill="#8c1d1d">2</text>

  <!-- ===== NODES (drawn on top of edges) ===== -->

  <!-- S (start) -->
  <circle cx="310" cy="65" r="30" fill="#d4e6f7" stroke="#2c6fad" stroke-width="2.5"/>
  <text x="310" y="61" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">S</text>
  <text x="310" y="77" text-anchor="middle" font-size="12" fill="#555">h=8</text>

  <!-- A -->
  <circle cx="140" cy="190" r="30" fill="#fff" stroke="#444" stroke-width="1.8"/>
  <text x="140" y="186" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">A</text>
  <text x="140" y="202" text-anchor="middle" font-size="12" fill="#555">h=8</text>

  <!-- B -->
  <circle cx="480" cy="190" r="30" fill="#fff" stroke="#444" stroke-width="1.8"/>
  <text x="480" y="186" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">B</text>
  <text x="480" y="202" text-anchor="middle" font-size="12" fill="#555">h=6</text>

  <!-- C -->
  <circle cx="60" cy="335" r="30" fill="#fff" stroke="#444" stroke-width="1.8"/>
  <text x="60" y="331" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">C</text>
  <text x="60" y="347" text-anchor="middle" font-size="12" fill="#555">h=4</text>

  <!-- D -->
  <circle cx="310" cy="335" r="30" fill="#fff" stroke="#444" stroke-width="1.8"/>
  <text x="310" y="331" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">D</text>
  <text x="310" y="347" text-anchor="middle" font-size="12" fill="#555">h=7</text>

  <!-- E -->
  <circle cx="550" cy="335" r="30" fill="#fff" stroke="#444" stroke-width="1.8"/>
  <text x="550" y="331" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">E</text>
  <text x="550" y="347" text-anchor="middle" font-size="12" fill="#555">h=3</text>

  <!-- F -->
  <circle cx="155" cy="460" r="30" fill="#fff" stroke="#444" stroke-width="1.8"/>
  <text x="155" y="456" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">F</text>
  <text x="155" y="472" text-anchor="middle" font-size="12" fill="#555">h=2</text>

  <!-- G (goal) -->
  <circle cx="465" cy="460" r="30" fill="#d5f0d5" stroke="#276127" stroke-width="2.5"/>
  <text x="465" y="456" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">G</text>
  <text x="465" y="472" text-anchor="middle" font-size="12" fill="#555">h=0</text>

  <!-- Legend -->
  <g transform="translate(490, 20)">
    <circle cx="10" cy="10" r="8" fill="#d4e6f7" stroke="#2c6fad" stroke-width="1.5"/>
    <text x="24" y="15" font-size="11" fill="#444">Start</text>
    <circle cx="10" cy="32" r="8" fill="#d5f0d5" stroke="#276127" stroke-width="1.5"/>
    <text x="24" y="37" font-size="11" fill="#444">Goal</text>
  </g>
</svg>
