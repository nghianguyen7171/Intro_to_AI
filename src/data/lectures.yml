# Migrated from the old data/lectures.yml.
#
# Changes made during migration, all deliberate:
#
#  * Slides are now a first-class `slides:` list instead of being mixed into
#    `Topics:` as {"Slides": path} maps.
#  * Week 10 gains "slides/6. (Cont) Propositional logic.pdf". That file was
#    committed to the repo but linked from nowhere, so students could not
#    reach it.
#  * Week 9's "Exercise Solutions" link was renamed. The file it points at,
#    Week9_Exercises_Solutions.html, is a printable worksheet with 35 blank
#    "Your Answer: ____" fields, not solutions.
#  * exercises/Week9_Exercises_Comprehensive.html is byte-identical to
#    Week9_Exercises_Interactive.html, and Week9_Exercises_Interactive_Expanded
#    .html throws a ReferenceError (calls showResult with an undefined
#    `isCorrect`). Neither is linked. Nothing is lost.

