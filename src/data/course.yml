title: "Introduction to Artificial Intelligence"
short_name: "Intro to AI"
code: "EP15.TOKT11121 (DS) & EP16.TOKT11121 (AI)"

# Empty: the site is served from https://nghianguyen7171.github.io/Intro_to_AI/
# and all internal links are relative, so no prefix is needed.
baseurl: ""
canonical: "https://nghianguyen7171.github.io/Intro_to_AI"

university: "National Economics University"
university_url: "https://neu.edu.vn"
department: "Department of Data Science and Artificial Intelligence"
college: "School of Technology"

format: "In-person"
location: "National Economics University, 207 Giai Phong street, Bach Mai ward, Hanoi, Vietnam"

prerequisite_code: "EP16.TOKT11108"
prerequisite_name: "Fundamental Programming Concepts in Python"

description: |
  This course aims to deliver a comprehensive overview of Artificial
  Intelligence, its implications, applications, and the skills to leverage it.
  The course begins by describing what the latest generation of artificial
  intelligence techniques can do. After an introduction to some basic concepts
  and techniques, the course illustrates both the potential and current
  limitations of these techniques with examples from a variety of applications.

  We spend some time on understanding the strengths and weaknesses of human
  decision-making and learning, specifically in combination with AI systems.
  Exercises will include hands-on application of basic AI techniques as well as
  selection of appropriate technologies for a given problem and anticipation of
  design implications. In a final project, groups of students will participate
  in the creation of a simple AI-based application.

prerequisites:
  note: |
    If you'd like to waive the prerequisites, please send an email to the
    instructor. For each prerequisite, please clearly list which courses you've
    taken are equivalent, and highlight it in the transcript.
  items:
    - "**Prerequisite:** EP16.TOKT11108 (Fundamental Programming Concepts in Python)"
    - "**Programming experience:** Python programming skills required"
    - "**Mathematical background:** Basic understanding of algorithms and data structures"
    - "**Software tools:** Python, numpy, sklearn, Kaggle"

# Participation 20 + Midterm 20 + Final 60 = 100. The build enforces this.
assessment:
  items:
    - name: "Participation"
      weight: "20%"
      criteria: "Attendance, homework check, volunteering for class questions. Homework and discussion are posted in the LMS. Code is uploaded to Kaggle."
    - name: "Midterm Exam / Project"
      weight: "20%"
      criteria: "Project including presentation and submitted report. Criteria: content mastery; problem-solving skills; critical thinking; application of knowledge; time management."
    - name: "Final Exam"
      weight: "60%"
      criteria: "Comprehensive examination covering all course topics."

policies:
  homework: "Homework is uploaded after each class. Submit your work in the LMS. Homework correction will be given the next session. Students who volunteer to do exercises will get extra points."
  submission: "Assignments should be submitted through the LMS (Learning Management System). Code should be uploaded to the Kaggle platform."
  collaboration: "You may form study groups and discuss problems with your classmates. However, you must write up the assignment solutions and the code from scratch, without referring to notes from your joint session."

